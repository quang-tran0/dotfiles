-- =========================================================
-- Kitty terminal configuration.
-- Color palette: Catppuccin Frappe (synced with starship).
-- https://github.com/catppuccin/catppuccin
-- =========================================================

-- ---------- Font / rendering ----------
font_family                JetBrainsMono Nerd Font Mono
font_size                  12
adjust_font_size_for_dpi   0
font_features              -liga, +calt, +ss01
box_drawing_scale          0.001, 1, 1, 0.5

disable_ligatures          no
enable_audio_bell          no

shell                      zsh
shell_integration          disabled

-- ---------- Cursor ----------
cursor_shape               beam
cursor_beam_thickness      1.5
cursor_underline_thickness 2
cursor_blink_interval      0
mouse_hide_wait            0

-- ---------- Hyperlinks / text styles ----------
url_style                  curly
url_prefixes               http https gopher ftp ssh
url_color                  #8caaee
emphasized_text_style      underline #ca9ee6
strike_through_text_color  #626880

-- ---------- Window / padding ----------
remember_window_size       no
initial_window_width       720
initial_window_height      480
window_padding_width       20
window_padding_height      12
window_margin_width        0
window_margin_height       0

sync_to_monitor            no
hide_window_decorations    yes

-- ---------- Background / blur / opacity ----------
background_opacity                0.85
background_blur                   10
dynamic_background_opacity        yes
inactive_background_opacity       0.7

-- ---------- Scrollbar ----------
scrollbar_handle_opacity          0
scrollbar_track_opacity           0
scrollbar_track_hover_opacity     0
scrollbar_minimal                 yes

confirm_os_window_close           0

-- ---------- Tab bar ----------
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_tabs) if num_tabs > 1 else ''}
tab_bar_background_color    none
active_tab_background_color   #414559
active_tab_foreground_color   #c6d0f5
inactive_tab_background_color #303446
inactive_tab_foreground_color #838ba7
active_tab_font_style        bold
inactive_tab_font_style      normal

-- ---------- Catppuccin Frappe palette ----------
-- ANSI / Base16 colors (synced with starship catppuccin_frappe palette +
-- fastfetch `keyColor`: red/green/yellow/blue/magenta/cyan map to
-- color1/color2/color3/color4/color5/color6 below respectively).
foreground              #c6d0f5
background              #303446
cursor                  #f4b8e4
cursor_text_color       #303446
selection_foreground    #303446
selection_background    #f2d5cf
selection_border_color  #eebebe

# Black + Bright Black
color0                 #414559   -- surface0
color8                 #51576d   -- surface1

# Red + Bright Red
color1                 #e78284   -- red
color9                 #ea999c   -- maroon

# Green + Bright Green
color2                 #a6d189   -- green
color10                #a6d189   -- green (extra slot kept in family)

# Yellow + Bright Yellow
color3                 #e5c890   -- yellow
color11                #ef9f76   -- peach

# Blue + Bright Blue
color4                 #8caaee   -- blue
color12                #85c1dc   -- sapphire

# Magenta + Bright Magenta
color5                 #ca9ee6   -- mauve
color13                #f4b8e4   -- pink

# Cyan + Bright Cyan
color6                 #81c8be   -- teal
color14                #99d1db   -- sky

# White + Bright White
color7                 #b5bfe2   -- subtext1
color15                #c6d0f5   -- text

# Catppuccin accents exposed for prompt / extensions (color16..31)
color16                #f2d5cf   -- rosewater
color17                #eebebe   -- flamingo
color18                #ca9ee6   -- mauve
color19                #f4b8e4   -- pink
color20                #e78284   -- red
color21                #ea999c   -- maroon
color22                #ef9f76   -- peach
color23                #e5c890   -- yellow
color24                #a6d189   -- green
color25                #81c8be   -- teal
color26                #99d1db   -- sky
color27                #85c1dc   -- sapphire
color28                #8caaee   -- blue
color29                #babbf1   -- lavender
color30                #949cbb   -- overlay2
color31                #838ba7   -- overlay1

# ---------- Mark (search highlight) – lava-cat feel ----------
mark1_foreground      #303446
mark1_background      #e5c890
mark2_foreground      #303446
mark2_background      #ca9ee6
mark3_foreground      #303446
mark3_background      #a6d189

# ---------- Bell ----------
visual_bell_color      #e78284
bell_on_tab            yes
command_on_bell        none

# ---------- Misc polish ----------
scrollback_lines       10000
scrollback_pager_history_size 0
wheel_scroll_multiplier 1.0
mouse_scroll_multiplier 1.0
click_interval         0.5
focus_follows_mouse    no
pointer_shape_when_grabbed   arrow

# ---------- Platform ----------
macos_option_as_alt    no
macos_hide_from_tasks  no
macos_quit_when_last_window_closed no
macos_window_resizable yes
linux_display_server   wayland