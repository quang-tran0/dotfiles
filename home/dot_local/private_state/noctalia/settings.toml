[nightlight]
enabled = true
temperature_day = 6000
temperature_night = 5100

[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/quang-tran/Videos"

[plugins]
enabled = []

[shell]
lang = "en"

    [shell.screen_corners]
    enabled = true
    size = 30

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Blue"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "cava" ]

[wallpaper]
directory = "/home/quang-tran/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/quang-tran/Pictures/Wallpapers/3.jpg"

    [wallpaper.last]
    path = "/home/quang-tran/Pictures/Wallpapers/3.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/quang-tran/Pictures/Wallpapers/3.jpg"

    [[wallpaper.favorite]]
    path = "/home/quang-tran/Pictures/Wallpaper/4.jpg"
    theme_mode = "auto"

[widget.audio_visualizer]
bands = 10
centered = false
interactive = false
width = 82

[widget.clock]
font_family = "JetBrains Mono"
font_weight = 700
