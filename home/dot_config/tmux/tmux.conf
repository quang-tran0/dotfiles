# ── Core ─────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,screen*:RGB,tmux*:RGB"
set -g allow-passthrough on
set -sg escape-time 0
set -g focus-events on
set -s set-clipboard on
set -g mouse on
set -g history-limit 100000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off

set -g set-titles on
set -g set-titles-string "#S:#I.#P #W"
setw -g mode-keys vi

# ── Windows and panes ────────────────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Vim-like selection; tmux forwards it to the terminal clipboard via OSC 52.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Catppuccin Mocha ─────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 120
set -g status-style "bg=#11111b,fg=#cdd6f4"

set -g status-left "#[fg=#11111b,bg=#cba6f7,bold]  #S  #[fg=#cba6f7,bg=#11111b]"
set -g window-status-separator ""
set -g window-status-format "#[fg=#6c7086,bg=#11111b]  #I:#W #F  "
set -g window-status-current-format "#[fg=#89b4fa,bg=#11111b]#[fg=#11111b,bg=#89b4fa,bold] #I:#W #F #[fg=#89b4fa,bg=#11111b]"

set -g status-right "#{?client_prefix,#[fg=#11111b]#[bg=#f38ba8]#[bold] PREFIX #[default]#[bg=#11111b],}#[fg=#a6adc8] #{pane_current_command} #[fg=#45475a]│ #[fg=#a6e3a1]#H #[fg=#45475a]│ #[fg=#fab387]%a %d %b #[fg=#45475a]│ #[fg=#89b4fa,bold]%H:%M  "

set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-format "#{?pane_active,#[fg=#cba6f7]#[bold],#[fg=#6c7086]} #P · #{pane_current_command} · #{b:pane_current_path} "

set -g message-style "bg=#cba6f7,fg=#11111b,bold"
set -g message-command-style "bg=#89b4fa,fg=#11111b,bold"
setw -g mode-style "bg=#89b4fa,fg=#11111b,bold"
set -g menu-style "bg=#181825,fg=#cdd6f4"
set -g menu-selected-style "bg=#89b4fa,fg=#11111b,bold"
set -g menu-border-style "fg=#cba6f7"
set -g popup-style "bg=#181825,fg=#cdd6f4"
set -g popup-border-style "fg=#cba6f7"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#f9e2af"
setw -g clock-mode-colour "#89b4fa"
setw -g clock-mode-style 24

setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
