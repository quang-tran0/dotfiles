# ==============================================================================
# FONT CONFIGURATION
# ==============================================================================
font_family      Fira Code
bold_font        Fira Code Bold
italic_font      Fira Code Italic
bold_italic_font Fira Code Bold Italic
font_size        11.0
disable_ligatures never

# Giúp nét chữ đậm đà, tươi màu hơn (như đã thảo luận)
bold_is_bright   yes
text_composition_strategy legacy

# ==============================================================================
# WINDOW LAYOUT & PADDING
# ==============================================================================
# Khoảng cách lề bên trong giúp terminal thoáng như trong ảnh
window_padding_width 15 20

# Ẩn thanh tiêu đề cửa sổ
hide_window_decorations yes
confirm_os_window_close 0

# ==============================================================================
# TRANSPARENCY & BACKGROUND
# ==============================================================================
# Độ trong suốt của nền
background_opacity 0.85

# Đẩy mạnh độ tương phản dynamic
dynamic_background_opacity yes

# ==============================================================================
# COLOR SCHEME (Dark Pastel / OneDark-like look)
# ==============================================================================
background #11111b
foreground #cdd6f4

# Black
color0 #45475a
color8 #585b70

# Red
color1 #f38ba8
color9 #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# ==============================================================================
# TAB BAR & CURSOR
# ==============================================================================
show_hyperlink_targets yes
cursor_shape beam
cursor_blink_interval 0.5

# Ẩn tab bar nếu chỉ có 1 tab
tab_bar_style powerline
